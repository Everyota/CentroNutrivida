<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Nutrivida</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <div class="contenedor encabezado">
      <img src="assets/img/logo.png" width= "150" alt="Logo NutriVida"> 

      <nav aria-label="Navegación principal">
        <ul>
           <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="registro.html">Registro</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>

      <p id="usuario-actual"></p>

      <button id="btn-carrito" class="btn-carrito">
        Reserva de hora (<span id="contador-carrito">0</span>)
      </button>
    </div>
  </header>

  <main>
    <section id="login" class="seccion seccion-gris">
      <div class="contenedor formulario-contenedor">
        <h2>Registro</h2>

          <form id="form-agendamiento" class="form-agendamiento" novalidate>
        <div class="campo">
          <label for="rut-paciente">RUT</label>
          <input
            type="text"
            id="rut-paciente"
            maxlength="100"
            placeholder="12.345.678-9"
          >
          <small id="error-rut-paciente" class="error"></small>
        </div>
        <div class="campo">
          <label for="nombres-paciente">Nombres</label>
          <input
            type="text"
            id="nombres-paciente"
            maxlength="100"
            placeholder="Federico Alberto"
          >
          <small id="error-nombres-paciente" class="error"></small>
        </div>

        <div class="campo">
          <label for="apellidos-paciente">Apellidos</label>
          <input
            type="text"
            id="apellidos-paciente"
            maxlength="100"
            placeholder="Gómez Pérez"
          >
          <small id="error-apellidos-paciente" class="error"></small>
        </div>

        <div class="campo">
          <label for="email-paciente">Correo electrónico</label>
          <input
            type="email"
            id="email-paciente"
            maxlength="100"
            placeholder="nombre@duoc.cl"
          >
          <small id="error-email-paciente" class="error"></small>
        </div>
    <div class="campo">
          <label for="email-paciente">Contraseña</label>
          <input
            type="password"
            id="email-paciente"
            maxlength="100"
            placeholder="**********"
          >
          <small id="error-email-paciente" class="error"></small>
        </div>
        <div class="campo">
          <label for="celular-paciente">Celular</label>
          <input
            type="phone"
            id="celular-paciente"
            maxlength="100"
            placeholder="987654321"
          >
          <small id="error-celular-paciente" class="error"></small>
        </div>

        <div class="campo">
          <label for="prevision-paciente">Previsión</label>
          <select
            id="prevision-paciente"
          >
            <option value="">Seleccionar previsión</option>
            <option value="Fonasa">Fonasa</option>
            <option value="Isapre">Isapre</option>
            <option value="Particular">Particular</option>
          </select>
          <small id="error-prevision-paciente" class="error"></small>
        </div>

      <button id = "btn-registro" class = "btn-registro">Registrarse</button>
      </form>
      </div>
    </section>

    <aside id="panel-carrito" class="panel-carrito oculto" aria-label="Carrito de compras">
      <div class="panel-cabecera">
        <h2>Mi carrito</h2>
        <button id="cerrar-carrito" class="btn-cerrar" aria-label="Cerrar carrito">×</button>
      </div>

      <div id="lista-carrito"></div>

      <div class="resumen-carrito">
        <strong>Total: $<span id="total-carrito">0</span></strong>
        <button id="vaciar-carrito" class="boton boton-secundario">Vaciar carrito</button>
      </div>
    </aside>
  </main>

  <footer>
    <div class="contenedor">
      <p>EcoMarket · Desarrollo Fullstack I · DSY1104</p>
      <p>Ejemplo académico con HTML, CSS y JavaScript.</p>
    </div>
  </footer>

  <script src="login.js"></script>
  <script src="cargarUsuario.js"></script>
</body>
</html>
