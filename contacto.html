<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - EcoMarket</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
    <div class="contenedor encabezado">
      <h1>EcoMarket</h1>

      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="#productos">Productos</a></li>
          <li><a href="#login">Login</a></li>
          <li><a href="#contacto">Contacto</a></li>
        </ul>
      </nav>

      <button id="btn-carrito" class="btn-carrito">
        Carrito (<span id="contador-carrito">0</span>)
      </button>
    </div>
  </header>

  <main>
    <section id="contacto" class="seccion contenedor">
      <div class="formulario-contenedor">
        <h2>Contacto</h2>

        <form id="form-contacto" novalidate>
          <div class="campo">
            <label for="nombre-contacto">Nombre</label>
            <input
              type="text"
              id="nombre-contacto"
              maxlength="100"
              placeholder="Ingrese su nombre"
            >
            <small id="error-nombre-contacto" class="error"></small>
          </div>

          <div class="campo">
            <label for="correo-contacto">Correo electrónico</label>
            <input
              type="email"
              id="correo-contacto"
              maxlength="100"
              placeholder="nombre@gmail.com"
            >
            <small id="error-correo-contacto" class="error"></small>
          </div>

          <div class="campo">
            <label for="comentario-contacto">Comentario</label>
            <textarea
              id="comentario-contacto"
              maxlength="500"
              rows="5"
              placeholder="Escriba su mensaje"
            ></textarea>
            <small id="error-comentario-contacto" class="error"></small>
          </div>

          <button type="submit" class="boton">Enviar mensaje</button>
          <p id="mensaje-contacto" class="mensaje"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="contenedor">
      <p>EcoMarket · Desarrollo Fullstack I · DSY1104</p>
      <p>Ejemplo académico con HTML, CSS y JavaScript.</p>
    </div>
  </footer>

  <script src="contacto.js"></script>
</body>
</html>
